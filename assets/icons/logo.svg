<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient
      id="conectaGradient"
      x1="15"
      y1="20"
      x2="100"
      y2="100"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Símbolo CONECTA -->
  <g filter="url(#glow)">

    <path
      d="M82 18
         C48 18 22 42 22 72
         C22 102 48 106 82 106"
      stroke="url(#conectaGradient)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <circle
      cx="82"
      cy="18"
      r="7"
      fill="#06B6D4"
    />

    <circle
      cx="82"
      cy="106"
      r="7"
      fill="#2563EB"
    />

    <path
      d="M82 18 L101 7"
      stroke="#06B6D4"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
      d="M82 106 L101 117"
      stroke="#2563EB"
      stroke-width="4"
      stroke-linecap="round"
    />

    <circle
      cx="104"
      cy="6"
      r="5"
      fill="#06B6D4"
    />

    <circle
      cx="104"
      cy="118"
      r="5"
      fill="#2563EB"
    />

  </g>

  <!-- Nombre -->
  <text
    x="125"
    y="69"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="39"
    font-weight="700"
    letter-spacing="2"
  >
    CONECTA
  </text>

  <!-- Slogan -->
  <text
    x="127"
    y="94"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="0.4"
  >
    Transformamos ideas en tecnología.
  </text>

</svg>